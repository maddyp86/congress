# .github/workflows/congress-votes.yml
name: Collect Congress Votes (119)

# Responsibility: Fetch all votes, upload to GCS, write manifest.
# No incremental diff logic — that is handled downstream by n8n using the
# Vote_Manifest Google Sheet as the system of record.
#
# Chambers run as independent jobs (Oct 2026):
#   - House  runs on GitHub-hosted runners. clerk.house.gov retired its vote
#            index pages, so the patched scraper discovers votes by walking
#            /evs/<year>/rollNNN.xml.
#   - Senate also runs on GitHub-hosted runners, but senate.gov returns 403
#            to GitHub's cloud IPs regardless of User-Agent, so its fetch goes
#            through the proxy in the SENATE_PROXY_URL secret. No secret =
#            Senate job skipped with a warning.
#   Each chamber publishes on its own, so one chamber failing never blocks
#   the other. The manifest builder unions with what's already in GCS, so a
#   single-chamber publish never drops the other chamber's entries.

on:
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Force full re-fetch (ignore --fast)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  schedule:
    - cron: "0 10 * * *"    # nightly fast mode (10:00 UTC, after bills at 09:30)
    - cron: "0 11 * * 0"    # weekly full mode (Sunday 11:00 UTC)

concurrency:
  group: collect-congress-votes
  cancel-in-progress: true

permissions:
  contents: read

env:
  SESSIONS: ${{ secrets.SESSIONS || '119.2025,119.2026' }}
  GCS_BUCKET: ${{ secrets.GCS_BUCKET || 'congress-legislative-data' }}
  GCS_PREFIX: ${{ secrets.GCS_PREFIX || 'congress-vote-data' }}
  # 'full' on the weekly schedule or a forced manual run, otherwise 'fast'.
  # (Avoids the `cond && '' || x` trap: an empty string is falsy in expressions.)
  FETCH_MODE: ${{ (github.event.schedule == '0 11 * * 0' || inputs.full_sync == 'true') && 'full' || 'fast' }}

jobs:
  # -------------------------------------------------------------------
  # HOUSE — GitHub-hosted
  # -------------------------------------------------------------------
  house:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install congress tool (this fork)
        run: |
          set -euo pipefail
          python -m venv env
          . env/bin/activate
          python -m pip install --upgrade pip
          pip install .

      - name: Fetch House votes
        run: |
          set -euo pipefail
          . env/bin/activate
          FLAG=""; [ "$FETCH_MODE" = "fast" ] && FLAG="--fast"
          echo "Mode: ${FETCH_MODE}"
          usc-run votes --chamber=house --sessions="${SESSIONS}" ${FLAG} --log=info

      - name: Validate House votes
        run: |
          set -euo pipefail
          COUNT=$(find data -type f -name data.json -path "*/votes/*/h*/*" | wc -l | tr -d ' ')
          echo "House vote data.json files: ${COUNT}"
          echo "### House votes fetched: ${COUNT}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${COUNT}" -eq 0 ]; then
            echo "::error::House produced 0 votes — check the Fetch step log"
            exit 1
          fi

      - name: Package House votes
        run: tar czf votes-house.tgz data/*/votes

      - uses: actions/upload-artifact@v4
        with:
          name: votes-house
          path: votes-house.tgz
          retention-days: 3

  publish-house:
    needs: house
    runs-on: ubuntu-latest
    concurrency:
      group: congress-votes-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: votes-house
      - run: tar xzf votes-house.tgz
      - uses: ./.github/actions/publish-votes
        with:
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}
          gcp_project: ${{ secrets.GCP_PROJECT }}
          gcs_bucket: ${{ env.GCS_BUCKET }}
          gcs_prefix: ${{ env.GCS_PREFIX }}

  # -------------------------------------------------------------------
  # SENATE — GitHub-hosted, routed through a proxy
  #
  # senate.gov returns 403 to GitHub's cloud IPs. Senate requests go out
  # through the proxy in the SENATE_PROXY_URL secret (e.g. a residential
  # proxy: http://user:pass@host:port). Only the fetch step uses it.
  # Until that secret exists, the job is skipped with a visible warning
  # instead of failing every night; House is unaffected either way.
  # -------------------------------------------------------------------
  senate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      enabled: ${{ steps.proxy.outputs.enabled }}
    steps:
      - name: Check Senate proxy is configured
        id: proxy
        env:
          SENATE_PROXY_URL: ${{ secrets.SENATE_PROXY_URL }}
        run: |
          if [ -n "${SENATE_PROXY_URL}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Senate votes skipped::senate.gov blocks GitHub-hosted runners. Add a SENATE_PROXY_URL repo secret to fetch Senate votes."
            echo "### ⚠️ Senate votes skipped — SENATE_PROXY_URL secret not set" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.proxy.outputs.enabled == 'true'
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        if: steps.proxy.outputs.enabled == 'true'
        with:
          python-version: "3.11"

      - name: Install congress tool (this fork)
        if: steps.proxy.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          python -m venv env
          . env/bin/activate
          python -m pip install --upgrade pip
          pip install .

      - name: Fetch Senate votes (via proxy)
        if: steps.proxy.outputs.enabled == 'true'
        env:
          HTTPS_PROXY: ${{ secrets.SENATE_PROXY_URL }}
          HTTP_PROXY: ${{ secrets.SENATE_PROXY_URL }}
        run: |
          set -euo pipefail
          . env/bin/activate
          FLAG=""; [ "$FETCH_MODE" = "fast" ] && FLAG="--fast"
          echo "Mode: ${FETCH_MODE}"
          usc-run votes --chamber=senate --sessions="${SESSIONS}" ${FLAG} --log=info

      - name: Validate Senate votes
        if: steps.proxy.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          COUNT=$(find data -type f -name data.json -path "*/votes/*/s*/*" | wc -l | tr -d ' ')
          echo "Senate vote data.json files: ${COUNT}"
          echo "### Senate votes fetched: ${COUNT}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${COUNT}" -eq 0 ]; then
            echo "::error::Senate produced 0 votes — check the Fetch step log"
            exit 1
          fi

      - name: Package Senate votes
        if: steps.proxy.outputs.enabled == 'true'
        run: tar czf votes-senate.tgz data/*/votes

      - uses: actions/upload-artifact@v4
        if: steps.proxy.outputs.enabled == 'true'
        with:
          name: votes-senate
          path: votes-senate.tgz
          retention-days: 3

  publish-senate:
    needs: senate
    if: needs.senate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: congress-votes-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: votes-senate
      - run: tar xzf votes-senate.tgz
      - uses: ./.github/actions/publish-votes
        with:
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}
          gcp_project: ${{ secrets.GCP_PROJECT }}
          gcs_bucket: ${{ env.GCS_BUCKET }}
          gcs_prefix: ${{ env.GCS_PREFIX }}
